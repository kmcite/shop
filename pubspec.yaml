name: shop
description: "A new Flutter project."
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  flutter_bloc: ^9.1.1
  # shared_database:
  #   git:
  #     url: https://github.com/kmcite/shared_database.git

  shared_database:
    path: ../shared_database
  material_ui: ^1.11.1
  metro_ui: ^0.3.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.13.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/

# App icon + splash generation. Regenerate after changing assets/:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#14B8A6"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter_native_splash:
  color: "#14B8A6"
  image: "assets/splash.png"
  android_12:
    color: "#14B8A6"
    image: "assets/splash.png"
    icon_background_color: "#14B8A6"
